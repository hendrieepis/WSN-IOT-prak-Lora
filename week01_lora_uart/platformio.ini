[platformio]
default_envs = receiver

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    sandeepmistry/LoRa@^0.8.0

; Arduino Uno asli muncul sebagai /dev/ttyACM*, klon berbasis CH340 sebagai
; /dev/ttyUSB*. Jalankan `pio device list` lalu sesuaikan dua baris di tiap
; environment. Windows memakai COMx.
[env:sender]
build_src_filter = +<sender/*.cpp>
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:receiver]
build_src_filter = +<receiver/*.cpp>
upload_port  = /dev/ttyACM1
monitor_port = /dev/ttyACM1
