; Modul 07 - hanya kedua SLAVE yang dibangun di sini.
;
; Master modul ini adalah Raspberry Pi yang menjalankan src/master.py; tidak
; ada environment PlatformIO untuknya, dan memang tidak perlu -- Python
; dijalankan langsung, tidak dikompilasi. Yang tersisa untuk PlatformIO
; hanyalah dua Arduino Uno di sisi slave.
;
;     pio run -d week07_rpi_master_slave -e slave1 -t upload
;     pio run -d week07_rpi_master_slave -e slave2 -t upload
;     python3 week07_rpi_master_slave/src/master.py     # di Raspberry Pi

[platformio]
default_envs = slave1

[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    sandeepmistry/LoRa@^0.8.0

; BOARD BERCAMPUR (asli + klon) TIDAK MEMENGARUHI FIRMWARE.
; Jalankan `python3 ../tools/deteksi_port.py` untuk melihat port mana milik
; jenis board yang mana, lalu sesuaikan baris upload_port/monitor_port di
; bawah. Nilai di bawah hanya contoh untuk dua Uno asli.
; Modul ini memakai 115200 baud, sama seperti M05.
monitor_speed = 115200

; Kedua slave memakai source yang sama; nomornya ditentukan build flag.
[env:slave1]
build_src_filter = +<slave/*.cpp>
build_flags = -DSLAVE_ID=1
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:slave2]
build_src_filter = +<slave/*.cpp>
build_flags = -DSLAVE_ID=2
upload_port  = /dev/ttyACM1
monitor_port = /dev/ttyACM1
