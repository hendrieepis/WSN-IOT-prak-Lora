; Modul 11 - LoRaWAN OTAA ke ChirpStack lewat single channel gateway.
;
; Hanya KEDUA NODE yang dibangun di sini. Gateway modul ini adalah Raspberry
; Pi 5 yang menjalankan gateway/single_chan_pkt_fwd.py -- tidak ada environment
; PlatformIO untuknya, sama seperti M07 yang masternya juga Python.
;
;     pio run -d week11_lorawan_chirpstack -e node1 -t upload
;     pio run -d week11_lorawan_chirpstack -e node2 -t upload
;     python3 gateway/single_chan_pkt_fwd.py        # di Raspberry Pi
;
; ATAU cukup:  python3 week11_lorawan_chirpstack/upload_auto.py

[platformio]
default_envs = node1

[env]
platform = atmelavr
board = uno
framework = arduino

; MCCI LoRaWAN LMIC -- stack LoRaWAN 1.0.3 Class A lengkap (join, MIC, enkripsi,
; frame counter, jendela RX1/RX2). Berbeda dari library sandeepmistry/LoRa yang
; dipakai M01-M10: yang itu hanya lapisan PHY (kirim byte), yang ini lapisan MAC.
lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library@^4.1.1

; KONFIGURASI LMIC LEWAT BUILD FLAG.
; ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS mematikan header konfigurasi bawaan
; library, sehingga seluruh pilihan ditentukan di sini dan terlihat jelas.
;
;   CFG_eu868          : rencana kanal dinamis (frekuensi kanal boleh diatur
;                        sendiri lewat LMIC_setupChannel) -- dipakai untuk
;                        MEMAKSA kanal tunggal 433.175 MHz. Lihat catatan
;                        "EU433 di atas rencana EU868" pada README bagian 3.
;   CFG_sx1276_radio   : radio pada Dragino LoRa Shield v1.2.
;   DISABLE_PING/BEACONS : Class B dimatikan -- modul ini Class A. Menghemat
;                        ~1 KB flash dan RAM yang sangat berharga di ATmega328P.
;   LMIC_ENABLE_arbitrary_clock_error : mengizinkan LMIC_setClockError() dengan
;                        nilai besar, supaya jendela RX node dibuka lebih lebar
;                        dan toleran terhadap gateway Python yang penjadwalan
;                        downlink-nya tidak sepresisi konsentrator SX1301.
build_flags =
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    -D DISABLE_PING
    -D DISABLE_BEACONS
    -D LMIC_ENABLE_arbitrary_clock_error=1
    -D DISABLE_LMIC_FAILURE_TO
    -D LMIC_PRINTF_TO=Serial

monitor_speed = 115200

; Kedua node memakai source yang sama; nomornya ditentukan build flag, dan
; NODE_ID itulah yang memilih blok kunci OTAA di src/node/lorawan_keys.h
; sekaligus rentang dummy sensornya.
[env:node1]
build_src_filter = +<node/*.cpp>
build_flags = ${env.build_flags} -D NODE_ID=1
upload_port  = /dev/ttyACM1
monitor_port = /dev/ttyACM1

[env:node2]
build_src_filter = +<node/*.cpp>
build_flags = ${env.build_flags} -D NODE_ID=2
upload_port  = /dev/ttyACM2
monitor_port = /dev/ttyACM2
