[platformio]
default_envs = gateway

; ── MODE SLOT: satu-satunya baris yang diganti antara EXP-01 dan EXP-02 ──────
; Keduanya memakai infrastruktur yang sama persis (SYNC, slot, guard time);
; yang berbeda hanya kebijakan siapa memakai slot mana -- dan justru di situlah
; protokolnya berganti nama:
;
;   mode = 1  -> Mode A, slot diundi tiap siklus   = Slotted ALOHA  (EXP-01)
;   mode = 0  -> Mode B, slot tetap per node       = TDMA           (EXP-02)
;
; Sesudah mengubahnya, unggah ulang KEDUA node (gateway tidak perlu: firmware
; gateway tidak tahu-menahu soal cara node memilih slot).
[slot]
mode = 1

; Jumlah slot per siklus. Dibaca gateway DAN kedua node dari satu tempat ini,
; sehingga ketiganya mustahil berbeda. Dipakai untuk tabel D (peluang tabrakan
; 1/count) dan Challenge CH-1/CH-4. Panjang satu siklus = count x 800 ms.
count = 2

[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    sandeepmistry/LoRa@^0.8.0

; BOARD BERCAMPUR (asli + klon) TIDAK MEMENGARUHI FIRMWARE.
; Keduanya ATmega328P dengan protokol unggah "arduino" yang sama, dan berkas
; .hex yang dihasilkan identik. Yang berbeda hanya nama port: Uno asli muncul
; sebagai /dev/ttyACM*, klon ber-bridge CH340/CH343/FTDI sebagai /dev/ttyUSB*,
; sedangkan Windows memakai COMx untuk keduanya.
;
; Jalankan `python3 ../tools/deteksi_port.py` untuk melihat port mana milik
; jenis board yang mana, lalu sesuaikan baris upload_port/monitor_port di
; bawah. Nilai di bawah hanya contoh untuk tiga Uno asli.
monitor_speed = 115200

[env:gateway]
build_src_filter = +<gateway/*.cpp>
build_flags = -DSLOT_COUNT=${slot.count}
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Kedua node memakai source yang sama; nomor node dan mode slot sama-sama
; ditentukan build flag, sehingga src/node/main.cpp tidak perlu disentuh.
[env:node1]
build_src_filter = +<node/*.cpp>
build_flags = -DNODE_ID=1 -DSLOT_MODE_RANDOM=${slot.mode} -DSLOT_COUNT=${slot.count}
upload_port  = /dev/ttyACM1
monitor_port = /dev/ttyACM1

[env:node2]
build_src_filter = +<node/*.cpp>
build_flags = -DNODE_ID=2 -DSLOT_MODE_RANDOM=${slot.mode} -DSLOT_COUNT=${slot.count}
upload_port  = /dev/ttyACM2
monitor_port = /dev/ttyACM2
