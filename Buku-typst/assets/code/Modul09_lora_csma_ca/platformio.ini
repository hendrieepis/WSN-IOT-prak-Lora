[platformio]
default_envs = gateway

[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    sandeepmistry/LoRa@^0.8.0

; BOARD BERCAMPUR (asli + klon) TIDAK MEMENGARUHI FIRMWARE.
; Keduanya ATmega328P dengan protokol unggah "arduino" yang sama, dan berkas
; .hex yang dihasilkan identik. Yang berbeda hanya nama port: Uno asli muncul
; sebagai /dev/ttyACM*, klon ber-bridge CH340/CH343/FTDI sebagai /dev/ttyUSB*,
; sedangkan Windows memakai COMx untuk keduanya.
;
; Jalankan `python3 ../tools/deteksi_port.py` untuk melihat port mana milik
; jenis board yang mana, lalu sesuaikan baris upload_port/monitor_port di
; bawah. Nilai di bawah hanya contoh untuk tiga Uno asli.
monitor_speed = 115200

[env:gateway]
build_src_filter = +<gateway/*.cpp>
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Kedua node memakai source yang sama; nomornya ditentukan build flag.
;
; CS_MODE menentukan CARA node mendengarkan kanal sebelum mengirim:
;   -DCS_MODE=0  -> carrier sense berbasis RSSI  (bawaan, paling mudah diamati)
;   -DCS_MODE=1  -> carrier sense berbasis CAD   (Channel Activity Detection)
;   -DCS_MODE=2  -> telinga dimatikan, node kirim buta (pembanding Pure ALOHA)
; Ketiganya ada di src/node/main.cpp. EXP-04 membandingkan mode 0 dengan mode 2,
; EXP-05 membandingkan mode 0 dengan mode 1: ganti angkanya di KEDUA node,
; unggah ulang, lalu bandingkan hasilnya.
;
; Interval kirim juga bisa ditimpa dari sini untuk EXP-03, tanpa mengedit source:
;   -DSEND_INTERVAL_MIN=300 -DSEND_INTERVAL_MAX=500

[env:node1]
build_src_filter = +<node/*.cpp>
build_flags = -DNODE_ID=1 -DCS_MODE=0
upload_port  = /dev/ttyACM1
monitor_port = /dev/ttyACM1

[env:node2]
build_src_filter = +<node/*.cpp>
build_flags = -DNODE_ID=2 -DCS_MODE=0
upload_port  = /dev/ttyACM2
monitor_port = /dev/ttyACM2
